name: Biomedical RAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag biomedical-rag:ci .

      - name: Run 18 unit tests
        run: docker run --rm biomedical-rag:ci python /app/test_v5.py

      - name: Run 6 graph integration tests
        run: docker run --rm biomedical-rag:ci python /app/test_v5_graph.py
