name: Biomedical RAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download repository code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --tag biomedical-rag:ci .

      - name: Run 18 unit tests
        run: docker run --rm biomedical-rag:ci python /app/test_v5.py

      - name: Run 6 graph integration tests
        run: docker run --rm biomedical-rag:ci python /app/test_v5_graph.py

      - name: Publish tested image to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag biomedical-rag:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"
          printf 'Image: %s:%s\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"  